services:
  redis:
    image: redis:8.8
    container_name: multimodal-redis

    ports:
      - "6379:6379"

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec

    volumes:
      - redis_data:/data

    restart: unless-stopped

volumes:
  redis_data:
