[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-inference-system"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

dependencies = [
    "SQLAlchemy==2.0.51",
    "alembic==1.18.5",
    "psycopg[binary]==3.3.4",
    "boto3",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]
