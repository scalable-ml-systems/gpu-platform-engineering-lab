manifest:
  schema_version: "1.0"
  manifest_id: "versions-nvidia-gpu-cluster-operations-r01"
  project: "nvidia-gpu-cluster-operations"
  repository_path: "gpu-platform-engineering-lab/nvidia-gpu-cluster-operations"
  environment: "rtx4090-primary"
  hardware_profile_id: "hw-rtx4090-4gpu-pcie-r01"
  created_at_utc: null
  updated_at_utc: null
  captured_by: null
  status: "draft"
  notes: >
    Populate discovered values from the provisioned host before installation.
    Populate verified values only after the component passes its validation check.

version_policy:
  component_status_values:
    - "planned"
    - "pending-discovery"
    - "pending-verification"
    - "installed"
    - "verified"
    - "failed"
    - "not-applicable"
  pinning_rules:
    host_packages: "Pin major and minor versions where provider compatibility permits."
    kubernetes_components: "Pin exact chart or manifest release versions."
    container_images: "Record immutable image digest in addition to the human-readable tag."
    python_dependencies: "Use a lock file with exact package versions."
  prohibited_tags:
    - "latest"
    - "stable"
    - "main"
    - "master"
  change_control:
    require_adr_for:
      - "kubernetes distribution change"
      - "container runtime change"
      - "NVIDIA integration path change"
      - "scheduler or admission framework change"
      - "monitoring stack replacement"
      - "training framework change"
      - "inference runtime change"

