$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.invalid/schemas/experiment-result.schema.yaml"
title: "NVIDIA GPU Cluster Operations Experiment Result"
description: >
  Normalized record of one experiment run. The result references hardware,
  software, workload, and evidence artifacts without duplicating them.
type: object
additionalProperties: false
required:
  - schema_version
  - experiment_id
  - run_id
  - project
  - lifecycle
  - timing
  - context
  - objective
  - hypothesis
  - execution
  - observations
  - metrics
  - verdict
  - evidence
  - operator_conclusion
properties:
  schema_version:
    type: string
    const: "1.0"
  experiment_id:
    type: string
    pattern: "^exp-[a-z0-9]+-[a-z0-9-]+-r[0-9]{2}$"
  run_id:
    type: string
    pattern: "^run-exp-[a-z0-9]+-[a-z0-9-]+-r[0-9]{2}-[0-9]{8}t[0-9]{6}z$"
  project:
    type: string
    const: "nvidia-gpu-cluster-operations"
  lifecycle:
    type: object
    additionalProperties: false
    required: [status, revision]
    properties:
      status:
        type: string
        enum: [draft, running, completed, failed, invalid, superseded]
      revision:
        type: integer
        minimum: 1
      supersedes_run_id:
        anyOf:
          - type: "null"
          - type: string
  timing:
    type: object
    additionalProperties: false
    required: [started_at_utc, completed_at_utc, duration_seconds]
    properties:
      started_at_utc:
        anyOf:
          - type: "null"
          - type: string
            format: date-time
      completed_at_utc:
        anyOf:
          - type: "null"
          - type: string
            format: date-time
      duration_seconds:
        anyOf:
          - type: "null"
          - type: number
            minimum: 0
  context:
    type: object
    additionalProperties: false
    required:
      - phase
      - domain
      - hardware_profile_id
      - software_manifest_id
      - qualification_profile_id
      - workload_contract_id
      - source_commit
    properties:
      phase:
        type: string
        enum:
          - phase-1-cluster-deployment
          - phase-2-gpu-network-qualification
          - phase-3-workload-scheduling
          - phase-4-training-inference
          - phase-5-observability-slos
          - phase-6-incident-drills
          - phase-7-bounded-remediation
      domain:
        type: string
        enum: [host, gpu, topology, network, nccl, kueue, pytorch, vllm, observability, incident, remediation]
      hardware_profile_id:
        type: string
        pattern: "^hw-[a-z0-9]+-[1-9][0-9]*gpu-[a-z0-9-]+-r[0-9]{2}$"
      software_manifest_id:
        type: string
        const: "versions-nvidia-gpu-cluster-operations-r01"
      qualification_profile_id:
        anyOf:
          - type: "null"
          - type: string
      workload_contract_id:
        anyOf:
          - type: "null"
          - type: string
      source_commit:
        anyOf:
          - type: "null"
          - type: string
            pattern: "^[0-9a-f]{7,40}$"
      namespace:
        anyOf:
          - type: "null"
          - type: string
      kubernetes_resource:
        anyOf:
          - type: "null"
          - type: object
            additionalProperties: false
            required: [kind, name]
            properties:
              kind: {type: string}
              name: {type: string}
              uid:
                anyOf:
                  - type: "null"
                  - type: string
  objective:
    type: string
    minLength: 1
  hypothesis:
    type: object
    additionalProperties: false
    required: [statement, expected_result, falsification_condition]
    properties:
      statement: {type: string, minLength: 1}
      expected_result: {type: string, minLength: 1}
      falsification_condition: {type: string, minLength: 1}
  execution:
    type: object
    additionalProperties: false
    required: [execution_mode, command_or_manifest, parameters, prerequisites, safety_controls, retry_count]
    properties:
      execution_mode:
        type: string
        enum: [shell, kubernetes-job, kubernetes-workload, ansible, manual-observation, synthetic-fault, mixed]
      command_or_manifest:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}
      parameters:
        type: object
      prerequisites:
        type: array
        items: {type: string}
      safety_controls:
        type: array
        items: {type: string}
      retry_count:
        type: integer
        minimum: 0
  observations:
    type: object
    additionalProperties: false
    required: [expected, observed, deviations, warnings, errors]
    properties:
      expected: {type: array, items: {type: string}}
      observed: {type: array, items: {type: string}}
      deviations: {type: array, items: {type: string}}
      warnings: {type: array, items: {type: string}}
      errors: {type: array, items: {type: string}}
  metrics:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, value, unit, aggregation, source]
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        value:
          anyOf:
            - type: number
            - type: integer
            - type: string
            - type: boolean
        unit:
          type: string
          enum: [count, boolean, seconds, milliseconds, microseconds, bytes, gibibytes, gbytes-per-second, requests-per-second, tokens-per-second, percent, ratio, status, none]
        aggregation:
          type: string
          enum: [raw, min, max, mean, median, p50, p95, p99, sum, rate, final]
        source: {type: string, minLength: 1}
        labels:
          type: object
          additionalProperties: {type: string}
  verdict:
    type: object
    additionalProperties: false
    required: [result, criteria, failure_class, confidence, invalidation_reason]
    properties:
      result:
        type: string
        enum: [pass, fail, partial, inconclusive, invalid]
      criteria:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [criterion, result, evidence_reference]
          properties:
            criterion: {type: string, minLength: 1}
            result:
              type: string
              enum: [pass, fail, not-evaluated]
            evidence_reference:
              anyOf:
                - type: "null"
                - type: string
      failure_class:
        anyOf:
          - type: "null"
          - type: string
            enum: [container-oom, cuda-oom, workload-configuration, nccl-workload-error, fabric-qualification, network-qualification, gpu-runtime, gpu-health, insufficient-evidence]
      confidence:
        type: string
        enum: [high, medium, low]
      invalidation_reason:
        anyOf:
          - type: "null"
          - type: string
  evidence:
    type: object
    additionalProperties: false
    required: [root, artifacts]
    properties:
      root: {type: string, minLength: 1}
      artifacts:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [artifact_type, path, sha256, immutable]
          properties:
            artifact_type:
              type: string
              enum: [command-output, kubernetes-state, application-log, system-log, metrics-export, dashboard-snapshot, manifest, config, normalized-result, operator-notes, incident-timeline, other]
            path: {type: string, minLength: 1}
            sha256:
              anyOf:
                - type: "null"
                - type: string
                  pattern: "^[0-9a-f]{64}$"
            immutable: {type: boolean}
            description:
              anyOf:
                - type: "null"
                - type: string
  operator_conclusion:
    type: object
    additionalProperties: false
    required: [summary, operational_impact, next_action, production_caveats]
    properties:
      summary:
        anyOf:
          - type: "null"
          - type: string
      operational_impact:
        anyOf:
          - type: "null"
          - type: string
      next_action:
        anyOf:
          - type: "null"
          - type: string
      production_caveats:
        type: array
        items: {type: string}
  approvals:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [action, required, approved, approved_by, approved_at_utc]
      properties:
        action: {type: string}
        required: {type: boolean}
        approved:
          anyOf:
            - type: "null"
            - type: boolean
        approved_by:
          anyOf:
            - type: "null"
            - type: string
        approved_at_utc:
          anyOf:
            - type: "null"
            - type: string
              format: date-time
