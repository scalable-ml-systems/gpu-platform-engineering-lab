---
host_baseline_packages:
  - ca-certificates
  - curl
  - git
  - gnupg
  - jq
  - openssl
  - python3
  - python3-apt
  - rsync
  - socat
  - unzip

host_baseline_kernel_modules:
  - overlay
  - br_netfilter

host_baseline_sysctl:
  net.bridge.bridge-nf-call-iptables: "1"
  net.bridge.bridge-nf-call-ip6tables: "1"
  net.ipv4.ip_forward: "1"

host_baseline_disable_swap: true
host_baseline_enable_time_sync: true
host_baseline_validate_nvidia: true
host_baseline_expected_gpu_count: 4
host_baseline_expected_gpu_model_pattern: "RTX 4090"
host_baseline_expected_driver_branch_pattern: "^580\\."
